# prh dictionary: unify terminology across the docs.
# Seeded from api-document-style-guide.md "表記の統一" plus a few safe terms.
#
# Case convention: only the LOWERCASE English form is rewritten to Japanese.
# A PascalCase word (e.g. "Window") is a type name and is left untouched, so
# type names need no backticks in narrative. Patterns are case-sensitive
# (no /i flag) for this reason. Inline code and code blocks are separate AST
# nodes, so they are never touched. Word boundaries (\b) keep identifiers like
# "vertexBuffer"/"EventQueue" safe.
version: 1
rules:
  # --- graphics / framework terms (from 表記の統一) ---
  - expected: 頂点
    pattern: '/\bvertex\b/'
  - expected: 定数
    pattern: '/\bconstants?\b/'
  - expected: バインド
    pattern: '/\bbind\b/'
  - expected: パイプライン
    pattern: '/\bpipelines?\b/'
  - expected: バッファ
    pattern: '/\bbuffers?\b/'
  - expected: テクスチャ
    pattern: '/\btextures?\b/'
  # "static sampler" is kept verbatim, so exclude that case.
  - expected: サンプラー
    pattern: '/(?<![Ss]tatic )\bsamplers?\b/'
  - expected: レンダーターゲット
    pattern: '/\brender[ -]targets?\b/'
  - expected: ウィジェット
    pattern: '/\bwidgets?\b/'
  - expected: ビューポート
    pattern: '/\bviewports?\b/'
  - expected: シザー
    pattern: '/\bscissor\b/'
  - expected: スロット
    pattern: '/\bslots?\b/'
  - expected: バインディング
    pattern: '/\bbindings?\b/'
  - expected: ウィンドウ
    pattern: '/\bwindow\b/'
  - expected: ダイアログ
    pattern: '/\bdialogs?\b/'
  - expected: モーダル
    pattern: '/\bmodal\b/'
  - expected: モードレス
    pattern: '/\bmodeless\b/'
  - expected: イベント
    pattern: '/\bevents?\b/'
  - expected: モデル
    pattern: '/\bmodels?\b/'
  - expected: リスナー
    pattern: '/\blisteners?\b/'
  # --- additional safe terms (hint: 日本語に寄せる) ---
  - expected: レイテンシ
    pattern: '/\blatency\b/'
  - expected: アクセシビリティ
    pattern: '/\baccessibility\b/'
  - expected: 順序
    pattern: '/\bordering\b/'
  - expected: ツール
    pattern: '/\btools?\b/'
  - expected: ルート
    pattern: '/\broot\b/'
  - expected: トグル
    pattern: '/\btoggles?\b/'
  - expected: ニーモニック
    pattern: '/\bmnemonics?\b/'
  - expected: アロケーター
    pattern: '/\ballocators?\b/'
  - expected: コードポイント
    pattern: '/\bcode[ -]?points?\b/'
  - expected: アンドゥ
    pattern: '/\bundo\b/'
  - expected: リドゥ
    pattern: '/\bredo\b/'
  - expected: スナップショット
    pattern: '/\bsnapshots?\b/'
  - expected: リサイクル
    pattern: '/\brecycl(?:e|es|ed|ing)\b/'
  - expected: コールバック
    pattern: '/\bcallbacks?\b/'
  # "source code" guard before bare "source" so it does not become "ソース code".
  - expected: ソースコード
    pattern: '/\bsource[ -]?code\b/'
  - expected: ソース
    pattern: '/\bsources?\b/'
